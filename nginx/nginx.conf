worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /health {
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }

        location /identity/ {
            set $identity_upstream identity-service:4001;
            rewrite ^/identity/(.*)$ /api/v1/identity/$1 break;
            proxy_pass http://$identity_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Gateway nginx;
        }

        location /health/identity {
            set $identity_upstream identity-service:4001;
            proxy_pass http://$identity_upstream/health;
        }

        location /bookings/ {
            set $booking_upstream booking-service:4002;
            rewrite ^/bookings/(.*)$ /api/v1/bookings/$1 break;
            proxy_pass http://$booking_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Gateway nginx;
        }

        location /health/bookings {
            set $booking_upstream booking-service:4002;
            proxy_pass http://$booking_upstream/health;
        }

        location /configuration/ {
            set $configuration_upstream configuration-service:4003;
            rewrite ^/configuration/(.*)$ /api/v1/configuration/$1 break;
            proxy_pass http://$configuration_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Gateway nginx;
        }

        location /health/configuration {
            set $configuration_upstream configuration-service:4003;
            proxy_pass http://$configuration_upstream/health;
        }

        location /tracking/ {
            set $tracking_upstream tracking-service:4004;
            rewrite ^/tracking/(.*)$ /api/v1/tracking/$1 break;
            proxy_pass http://$tracking_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Gateway nginx;
        }

        location /health/tracking {
            set $tracking_upstream tracking-service:4004;
            proxy_pass http://$tracking_upstream/health;
        }
    }
}
