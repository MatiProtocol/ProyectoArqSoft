<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOVE - Monitoreo Geográfico</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1f2937; color: #fff; }
    #toolbar label { font-size: 13px; }
    #toolbar input { flex: 1; padding: 6px; border-radius: 4px; border: none; }
    #toolbar button { padding: 6px 14px; cursor: pointer; border: none; border-radius: 4px; background: #2563eb; color: #fff; }
    #toolbar button:hover { background: #1d4ed8; }
    #status { font-size: 12px; color: #9ca3af; min-width: 220px; text-align: right; }
    #map { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label for="token">Operator JWT:</label>
    <input id="token" type="text" placeholder="Pegar Bearer token con rol OPERATOR" />
    <button id="connect">Conectar</button>
    <span id="status">Sin conexión</span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
